name: Build Lift Log APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: pip install pillow
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm ci
      - run: npx cap add android
      - run: python3 setup_android.py
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk LiftLog.apk
      - uses: actions/upload-artifact@v4
        with: { name: LiftLog-apk, path: LiftLog.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lift Log (dernier APK)
          files: LiftLog.apk
